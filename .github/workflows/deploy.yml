name: Validate and deploy portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            analytics-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install analytics service dependencies
        run: npm --prefix analytics-worker ci

      - name: Validate code and content
        run: npm run check

      - name: Validate analytics service
        run: npm --prefix analytics-worker run check

      - name: Install browser for smoke tests
        run: npx playwright install --with-deps chromium

      - name: Build and run browser smoke tests
        run: npm run test:e2e

      - name: Build deployable site with analytics configuration
        if: github.event_name == 'push'
        run: npm run build
        env:
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: ${{ vars.NEXT_PUBLIC_ANALYTICS_ENDPOINT }}

      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5

      - name: Upload static site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
